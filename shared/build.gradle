plugins {
    id 'com.android.library'
}
android {
    namespace = 'com.shilapi.xcertplay.shared'
    compileSdk = 37

    defaultConfig {
        minSdk = 25
        targetSdk = 37

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64'
        }

        externalNativeBuild {
            ndkBuild {
                arguments 'APP_PLATFORM=android-25'
            }
        }

        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"
    }
    ndkVersion = '28.2.13676358'
    externalNativeBuild {
        ndkBuild {
            path = file('src/main/jni/Android.mk')
        }
    }
    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_11
        targetCompatibility = JavaVersion.VERSION_11
        // java.time.Instant and java.util.Base64 are API 26 APIs used by the pairing and
        // location code; desugaring supplies them on Android 7/7.1 (API 24/25).
        coreLibraryDesugaringEnabled = true
    }
    // Android 7 cannot reliably dlopen libs that stay uncompressed inside the APK
    // (extractNativeLibs=false, the AGP default): extract at install time instead.
    packaging {
        jniLibs.useLegacyPackaging = true
    }
}
dependencies {
    coreLibraryDesugaring libs.desugar.jdk.libs
    implementation libs.androidx.app
    implementation libs.bouncycastle
    implementation libs.jmdns
    testImplementation libs.junit
    testImplementation 'org.robolectric:robolectric:4.17'
}
