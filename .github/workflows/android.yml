name: Android checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      # Runtime authentication (MFi identity) packaged into the APK assets, then staged to
      # noBackupFilesDir by DiPlayBootstrap at first launch. Skips cleanly when secrets are absent.
      - name: Restore local authentication assets
        env:
          IDENTITY_B64: ${{ secrets.DIPLAY_IDENTITY_PK8_B64 }}
          CERTIFICATE_B64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY_B64:-}" ] || [ -z "${CERTIFICATE_B64:-}" ]; then
            echo "Runtime authentication secrets are unavailable; building without an identity."
            exit 0
          fi
          AUTH_DIR="$RUNNER_TEMP/auth-assets"
          mkdir -p "$AUTH_DIR/offline-mfi"
          printf '%s' "$IDENTITY_B64" | base64 -d > "$AUTH_DIR/offline-mfi/identity.pk8"
          printf '%s' "$CERTIFICATE_B64" | base64 -d > "$AUTH_DIR/offline-mfi/certificate.p7b"
          chmod 600 "$AUTH_DIR/offline-mfi/"*
          ls -l "$AUTH_DIR/offline-mfi"
          echo "DIPLAY_AUTH_ASSETS_DIR=$AUTH_DIR" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests, lint and source-only debug build
        # :common and :shared carry the runtime code and are the modules that minSdk 25 actually
        # affects. They were missing here, so an API 26 call in common reached the API 25 head
        # unit as a NoSuchMethodError at runtime. Lint is the only thing standing between a
        # lowered minSdk and that class of crash: keep every module's lintDebug here.
        run: ./gradlew :shared:testDebugUnitTest :common:testDebugUnitTest :home:testDebugUnitTest :shared:lintDebug :common:lintDebug :mobile:lintDebug :home:lintDebug :maphost:lintDebug :mobile:assembleDebug :home:assembleDebug :maphost:assembleDebug --stacktrace
      - name: Standalone debug APK
        # assembleDebug alone is the identity-free source build. The car unit needs the MFi
        # identity that the step above restored, and it has to come out of the workflow or
        # there is nothing to install.
        run: ./gradlew :mobile:assembleStandaloneDebug --stacktrace
      - name: Verify the packaged identity
        run: |
          set -euo pipefail
          APK=$(ls mobile/build/outputs/apk/debug/*.apk | head -1)
          unzip -l "$APK" | grep -q 'assets/offline-mfi/identity.pk8'
          unzip -l "$APK" | grep -q 'assets/offline-mfi/certificate.p7b'
          echo "identity.pk8 and certificate.p7b are packaged in $APK"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: mobile/build/outputs/apk/debug/*.apk
      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests/
            shared/build/reports/lint-results-debug.html
            common/build/reports/tests/
            common/build/reports/lint-results-debug.html
            mobile/build/reports/lint-results-debug.html
            samples/home/build/reports/tests/
            samples/home/build/reports/lint-results-debug.html
            samples/maphost/build/reports/lint-results-debug.html

  # Platform-signed release APK. The key never enters the repository: it rides in the same
  # secrets pattern as the MFi identity (base64 -> $RUNNER_TEMP) and is selected through the
  # ANDROID_KEYSTORE_* inputs the Gradle file documents. Missing secrets skip the job cleanly.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Materialize runtime authentication assets
        env:
          IDENTITY_B64: ${{ secrets.DIPLAY_IDENTITY_PK8_B64 }}
          CERTIFICATE_B64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY_B64:-}" ] || [ -z "${CERTIFICATE_B64:-}" ]; then
            echo "Runtime authentication secrets are unavailable; building without an identity."
            exit 0
          fi
          AUTH_DIR="$RUNNER_TEMP/auth-assets"
          mkdir -p "$AUTH_DIR/offline-mfi"
          printf '%s' "$IDENTITY_B64" | base64 -d > "$AUTH_DIR/offline-mfi/identity.pk8"
          printf '%s' "$CERTIFICATE_B64" | base64 -d > "$AUTH_DIR/offline-mfi/certificate.p7b"
          chmod 600 "$AUTH_DIR/offline-mfi/"*
          echo "DIPLAY_AUTH_ASSETS_DIR=$AUTH_DIR" >> "$GITHUB_ENV"
      - name: Restore the platform signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Release signing secrets are unavailable; skipping the release job."
            echo "DIPLAY_RELEASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "DIPLAY_RELEASE_ENABLED=true"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Stamp the build number
        run: |
          set -euo pipefail
          echo "DIPLAY_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "release versionName will be stamped 0.2.12（${GITHUB_RUN_NUMBER}）"
      - name: Platform-signed release APK
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        run: ./gradlew :mobile:assembleStandaloneRelease --stacktrace
      - name: Verify release APK manifest, ABI and signature
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        run: |
          set -euo pipefail
          APK=$(ls mobile/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|^minSdkVersion:|^targetSdkVersion:|^application-label:"
          # The car unit is Android 7 (API 25) with a 64-bit-capable SoC: an arm64 process cannot
          # load a v7a-only native library, so every bundled .so has to stay armeabi-v7a.
          echo "--- native libs ---"
          unzip -l "$APK" | grep "lib/" || echo "no bundled libs"
          unzip -l "$APK" | grep -E "offline-mfi" || echo "offline-mfi assets: absent"
          echo "--- signature ---"
          "$TOOLS/apksigner" verify --print-certs "$APK" | head -8
      - name: Upload release APK
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/outputs/apk/release/*.apk
