name: DiPlay PSA release
on:
  push:
    branches: [main, psa-verify, psa-beta]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  # Platform-signed release APK. The key never enters the repository: it rides in the same
  # secrets pattern as the MFi identity (base64 -> $RUNNER_TEMP) and is selected through the
  # ANDROID_KEYSTORE_* inputs the Gradle file documents. Missing secrets skip the job cleanly.
  #
  # The old "check" job (unit tests + lint on five modules + three assembleDebug tasks) was
  # removed on request: it roughly tripled the wall clock. Keep in mind that
  # :shared:lintDebug / :common:lintDebug were the only automated guard against an API 26+ call
  # leaking into this API 25 build, so when touching runtime code run
  # `python D:\Launcher\kotlin_static_check.py <changed .kt files>` locally before pushing.
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Reject credential files in public source
        run: python3 scripts/check_public_tree.py
      - name: Materialize runtime authentication assets
        env:
          IDENTITY_B64: ${{ secrets.DIPLAY_IDENTITY_PK8_B64 }}
          CERTIFICATE_B64: ${{ secrets.DIPLAY_CERTIFICATE_P7B_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${IDENTITY_B64:-}" ] || [ -z "${CERTIFICATE_B64:-}" ]; then
            echo "Runtime authentication secrets are unavailable; building without an identity."
            exit 0
          fi
          AUTH_DIR="$RUNNER_TEMP/auth-assets"
          mkdir -p "$AUTH_DIR/offline-mfi"
          printf '%s' "$IDENTITY_B64" | base64 -d > "$AUTH_DIR/offline-mfi/identity.pk8"
          printf '%s' "$CERTIFICATE_B64" | base64 -d > "$AUTH_DIR/offline-mfi/certificate.p7b"
          chmod 600 "$AUTH_DIR/offline-mfi/"*
          echo "DIPLAY_AUTH_ASSETS_DIR=$AUTH_DIR" >> "$GITHUB_ENV"
      - name: Restore the platform signing key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "Release signing secrets are unavailable; skipping the release job."
            echo "DIPLAY_RELEASE_ENABLED=false" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYSTORE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$KEYSTORE"
          chmod 600 "$KEYSTORE"
          {
            echo "DIPLAY_RELEASE_ENABLED=true"
            echo "ANDROID_KEYSTORE_PATH=$KEYSTORE"
            echo "ANDROID_KEYSTORE_PASSWORD=$STORE_PASSWORD"
            echo "ANDROID_KEY_ALIAS=$KEY_ALIAS"
            echo "ANDROID_KEY_PASSWORD=${KEY_PASSWORD:-$STORE_PASSWORD}"
          } >> "$GITHUB_ENV"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0 ndk;28.2.13676358
      - uses: gradle/actions/setup-gradle@v4
      - name: Stamp the build identity
        run: |
          set -euo pipefail
          echo "DIPLAY_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          # The short sha goes into versionName so a diagnostic report names the exact code on the
          # unit. The run number alone only says when the build ran, not what was in it.
          echo "DIPLAY_BUILD_COMMIT=${GITHUB_SHA::8}" >> "$GITHUB_ENV"
          # The beta channel ships its own applicationId and its own release-tag namespace; both
          # are derived from this flag, so a build can never be published into the wrong one.
          if [ "${GITHUB_REF_NAME}" = "psa-beta" ]; then
            echo "DIPLAY_CHANNEL=beta" >> "$GITHUB_ENV"
            echo "beta versionName will be stamped 0.2.15（${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}）-beta"
          else
            echo "release versionName will be stamped 0.2.15（${GITHUB_RUN_NUMBER}-${GITHUB_SHA::8}）"
          fi
      - name: Platform-signed release APK
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        run: ./gradlew :mobile:assembleStandaloneRelease --stacktrace
      - name: Verify release APK manifest, ABI and signature
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        run: |
          set -euo pipefail
          APK=$(ls mobile/build/outputs/apk/release/*.apk | head -1)
          echo "APK: $APK"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          "$TOOLS/aapt2" dump badging "$APK" | grep -E "^package:|^minSdkVersion:|^targetSdkVersion:|^application-label:|^uses-permission:"
          # The USB permission dialog is suppressed by holding MANAGE_USB, and whether the manifest
          # merge kept a hidden permission is not visible anywhere else, so assert it here.
          "$TOOLS/aapt2" dump badging "$APK" | grep -q "android.permission.MANAGE_USB" \
            || { echo "::error::the release APK does not declare android.permission.MANAGE_USB"; exit 1; }
          # The car unit is Android 7 (API 25) on a 64-bit SoC, and the APK must ship arm64-v8a.
          # Pinning it to armeabi-v7a forced the whole process to 32 bits, and the car's own hotspot
          # stopped accepting the phone in exactly that configuration (report 840, 64-bit: ok;
          # report 402, 32-bit: no TCP). lwIP's v7a-only libdiplay_lwip.so is simply not loadable in
          # an arm64 process, which attachLwip() already handles by falling back to the VPN transport.
          echo "--- native libs ---"
          unzip -l "$APK" | grep "lib/" || echo "no bundled libs"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/" \
            || { echo "::error::the release APK does not ship arm64-v8a"; exit 1; }
          unzip -l "$APK" | grep -E "offline-mfi" || echo "offline-mfi assets: absent"
          # A beta build must not carry the release applicationId: the two channels are meant to be
          # installable side by side, and an identical package name would silently replace the
          # release build instead — while the updater kept looking in the other tag namespace.
          if [ "${GITHUB_REF_NAME}" = "psa-beta" ]; then
            "$TOOLS/aapt2" dump badging "$APK" | grep -q "package: name='com.shihab.diplay.psabeta'" \
              || { echo "::error::the beta APK does not use the beta applicationId"; exit 1; }
          fi
          echo "--- signature ---"
          "$TOOLS/apksigner" verify --print-certs "$APK" | head -8
      - name: Upload release APK
        if: env.DIPLAY_RELEASE_ENABLED == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: mobile/build/outputs/apk/release/*.apk
      # Publishes to GitHub Releases so the APK is reachable without signing in to Actions.
      # RELEASE_NOTES.md is the standing status page; the commit message is appended so the
      # release page also says what changed in this build.
      - name: Publish to GitHub Releases
        if: env.DIPLAY_RELEASE_ENABLED == 'true' && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          APK=$(ls mobile/build/outputs/apk/release/*.apk | head -1)
          # Each channel keeps its own tag namespace. The in-app updater looks a build up by tag
          # prefix, so a shared namespace would let the release channel and the beta channel hand
          # each other their APKs through releases.atom or /releases/latest.
          if [ "${GITHUB_REF_NAME}" = "psa-beta" ]; then
            TAG="v0.2.15-beta-${GITHUB_RUN_NUMBER}"
            TITLE="DiPlay 0.2.15（${GITHUB_RUN_NUMBER}）· PSA beta 测试版"
          else
            TAG="v0.2.15-${GITHUB_RUN_NUMBER}"
            TITLE="DiPlay 0.2.15（${GITHUB_RUN_NUMBER}）· PSA"
          fi
          NOTES="$RUNNER_TEMP/release-notes.md"
          {
            if [ -f RELEASE_NOTES.md ]; then
              cat RELEASE_NOTES.md
            else
              printf 'DiPlay 0.2.15（%s）\n' "$GITHUB_RUN_NUMBER"
            fi
            echo
            echo '---'
            echo
            echo '### 本次改动'
            echo
            git log -1 --pretty='%B'
          } > "$NOTES"
          gh release create "$TAG" "$APK" \
            --title "$TITLE" \
            --notes-file "$NOTES" \
            --target "$GITHUB_SHA"
          echo "published https://github.com/${GITHUB_REPOSITORY}/releases/tag/${TAG}"
